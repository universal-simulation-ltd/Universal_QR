<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ⚠️ THE THEME, BEFORE THE FIRST PIXEL — and it has to be here, inline,
         rather than in the app.

         `<html>`'s dark ground is painted from `index.css` the moment the
         stylesheet lands, which is long before the ~840 kB module bundle has
         parsed — so without this a dark-mode user would get the light page
         first and the dark one a moment later, on every load.

         `createThemeStore` (the SDK) applies the same class at import time,
         which is early but not this early. This runs during head parsing,
         before the body exists, so the class is already on `<html>` when the
         first paint happens; the store then reads the same keys and agrees.

         The app's key is its OVERRIDE, from App preferences; absent, the app
         follows Global preferences' `universal:color-scheme` (SDK 0.143). Both
         are read here, or someone whose only choice is the global one gets the
         light page first and then a flip.

         ⚠️ THE KEY IS DUPLICATED — `src/stores/themeStore.ts` holds the other
         copy, and renaming one silently puts everybody back on following global. They are
         held together by `scripts/theme.test.mjs` (`npm run test:theme`),
         which reads this file and fails if the two ever drift. Do not "tidy"
         either away.

         Light is the default (the suite rule), so this only ever ADDS `dark`. -->
    <script>
      try {
        var pref = localStorage.getItem('unisim-qr-theme')
          || localStorage.getItem('universal:color-scheme') || 'light'
        if (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {
        /* private mode, storage disabled: light, exactly as the store falls back. */
      }
    </script>

    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal QR",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://opensource.unisim.co.uk/qr/",
      "description": "Universal QR — design branded, styled QR codes entirely in your browser. Custom colours, shapes, gradients and your logo. 100% free — every feature, no paywalls. Open source and works offline.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
