<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Primary SEO -->
    <title>Universal QR — design branded QR codes, in your browser</title>
    <meta name="description" content="Universal QR — design branded, styled QR codes entirely in your browser. Custom colours, shapes, gradients and your logo. 100% free — every feature, no paywalls. Open source and works offline." />
    <meta name="keywords" content="QR code generator, branded QR code, custom QR code, styled QR code, QR code with logo, free QR generator, offline QR code, open source" />
    <meta name="author" content="UNI·SIM" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://opensource.unisim.co.uk/qr/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal QR" />
    <meta property="og:url" content="https://opensource.unisim.co.uk/qr/" />
    <meta property="og:title" content="Universal QR — design branded QR codes, in your browser" />
    <meta property="og:description" content="Design branded, styled QR codes entirely in your browser. Custom colours, shapes, gradients and your logo. 100% free — every feature, no paywalls. Open source and works offline." />
    <meta property="og:image" content="https://opensource.unisim.co.uk/qr/og-image.png" />
    <meta property="og:image:secure_url" content="https://opensource.unisim.co.uk/qr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Universal QR — design branded QR codes in your browser" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universal QR — design branded QR codes, in your browser" />
    <meta name="twitter:description" content="Design branded, styled QR codes entirely in your browser. Custom colours, shapes, gradients and your logo. 100% free — every feature, no paywalls. Open source and works offline." />
    <meta name="twitter:image" content="https://opensource.unisim.co.uk/qr/og-image.png" />
    <meta name="twitter:image:alt" content="Universal QR — design branded QR codes in your browser" />
    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal QR",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",
      "url": "https://opensource.unisim.co.uk/qr/",
      "description": "Universal QR — design branded, styled QR codes entirely in your browser. Custom colours, shapes, gradients and your logo. 100% free — every feature, no paywalls. Open source and works offline.",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "author": [
        {
          "@type": "Person",
          "name": "James Markey",
          "honorificSuffix": "MBE",
          "jobTitle": "Founder & Director",
          "url": "https://www.unisim.co.uk/about-james"
        },
        {
          "@type": "Organization",
          "name": "UNI·SIM",
          "url": "https://www.unisim.co.uk",
          "subjectOf": {
            "@type": "BlogPosting",
            "name": "Welcome to the UNI·SIM studio",
            "url": "https://www.unisim.co.uk/blog/welcome-to-uni-sim"
          }
        }
      ],
      "provider": {
        "@type": "Organization",
        "name": "UNI·SIM",
        "url": "https://www.unisim.co.uk"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
